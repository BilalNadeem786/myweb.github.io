
name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'three-chapters-code/three-chapters-of-us/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: three-chapters-code/three-chapters-of-us
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: three-chapters-code/three-chapters-of-us/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: three-chapters-code/three-chapters-of-us/dist

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
